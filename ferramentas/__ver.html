<!doctype html>
<meta charset="utf-8">
<title>ver</title>
<!--
  FERRAMENTA DE CAPTURA, NAO FAZ PARTE DO SITE. Apagar antes de publicar
  junto com __diag.html (ver P13 em PENDENCIAS.md).

  Serve para tirar print de uma secao no meio da pagina, num viewport de
  largura arbitraria. Duas coisas obrigaram a existir:

  1. O Chrome headless trava a janela em 500px de largura minima. Um
     iframe tem viewport proprio de verdade.
  2. Navegar por ancora no headless devolve tela vazia, e um harness
     hospedado em OUTRA porta nao consegue rolar o iframe por script —
     e cross-origin e `contentDocument` vem nulo. Por isso este arquivo
     mora em public/: mesma origem, o script funciona.

  Uso:  /__ver.html?s=servicos&w=1180&h=840
        s = id da secao · w/h = viewport do iframe
-->
<style>
  html, body { margin: 0; background: #2a2a2e }
  iframe { border: 0; display: block }
</style>
<!-- O iframe fica no MARCADOR, nao criado por script: quando ele era
     criado no JS o print saia em branco, porque o
     --virtual-time-budget fecha o quadro antes de o elemento existir
     e comecar a carregar. -->
<iframe id="f" src="/"></iframe>
<script>
  const q = new URLSearchParams(location.search)
  const f = document.getElementById('f')
  f.style.width = (q.get('w') || 1180) + 'px'
  f.style.height = (q.get('h') || 840) + 'px'

  f.addEventListener('load', () => setTimeout(() => {
    const d = f.contentDocument
    /* REVELA ANTES DE ROLAR. Na ordem inversa o print caia na secao
       errada: revelar os blocos muda a altura do documento, e a posicao
       de rolagem ja calculada deixa de apontar para o alvo. */
    for (const r of d.querySelectorAll('.rev')) r.classList.add('rev-on')
    /* O IntersectionObserver NAO DISPARA sob --virtual-time-budget: as
       observacoes sao entregues nos passos de renderizacao, e o relogio
       virtual nao os produz. Entao o que depende de observer precisa
       ser ligado a mao aqui — senao o leque da equipe sai em branco no
       print e parece bug de layout. */
    for (const t of d.querySelectorAll('.equipe__trilho')) t.setAttribute('data-natela', '')
    const el = d.getElementById(q.get('s') || 'servicos')
    if (el) el.scrollIntoView()
    /* Os blocos abaixo da dobra sao escondidos apos a montagem e
       revelados por IntersectionObserver. Depois de um scroll
       programatico o observer pode nao ter reagido antes do print,
       entao aqui eles sao revelados a mao — o objetivo e ver o LAYOUT,
       nao a animacao de entrada. */
    /* Rola VARIAS vezes. Imagem com loading=lazy so reserva altura
       quando entra na tela, entao cada rolagem muda o documento e a
       posicao anterior deixa de apontar para o alvo. Repetir converge. */
    /* ?rolar=N rola por PIXEL, e e o caminho confiavel. Rolar por
       ancora nao converge: imagem com loading=lazy so reserva altura ao
       entrar na tela, entao cada rolagem muda o documento e a posicao
       anterior deixa de apontar para o alvo. */
    /* MATA A ROLAGEM SUAVE ANTES DE QUALQUER COISA.
       A folha do site tem `html { scroll-behavior: smooth }`, entao
       TODO `scrollTo` vira animacao — e o --virtual-time-budget do
       Chrome headless nao avanca linha do tempo de animacao, do mesmo
       jeito que nao avanca @keyframes. Resultado: a rolagem programada
       parava no meio e todo print saia numa secao antes do alvo. Foram
       cinco prints no lugar errado ate cair a ficha. */
    d.documentElement.style.scrollBehavior = 'auto'

    /* VARRE A PAGINA INTEIRA ANTES DE MIRAR.
       `loading="lazy"` so reserva a altura real quando a imagem entra
       na tela. Enquanto ha imagem por carregar abaixo, o documento
       cresce a cada rolagem e a posicao ja calculada deixa de apontar
       para o alvo — foi por isso que `?s=sobre` caia no rider tres
       vezes seguidas. Descer ate o fim em passos forca todas a
       carregar; dai em diante a altura para de mudar e mirar funciona. */
    const w = f.contentWindow
    const varrer = () => {
      const h = d.documentElement.scrollHeight
      for (let i = 1, t = 0; i <= 14; i++, t += 55)
        setTimeout(() => w.scrollTo(0, (h / 14) * i), t)
    }
    varrer()

    const rolar = Number(q.get('rolar') || 0)
    const ir = () => rolar ? w.scrollTo(0, rolar) : (el && el.scrollIntoView())
    for (const ms of [900, 1100, 1400, 1700]) setTimeout(ir, ms)

    /* LEVA TODA ANIMACAO AO QUADRO FINAL.
       O --virtual-time-budget do Chrome headless NAO avanca a linha do
       tempo de animacao: um elemento cuja opacidade vem de uma
       @keyframes sai do print no PRIMEIRO quadro, que costuma ser
       opacity 0. Foi assim que o leque da equipe apareceu vazio num
       print e pareceu bug de layout. `finish()` pula para o fim, que e
       o estado que interessa fotografar quando o assunto e LAYOUT.
       Varias passadas porque animacao com delay so existe depois que
       o delay corre, e a entrada do leque escalona ate 500ms. */
    const acabarTudo = () => {
      for (const n of d.querySelectorAll('*'))
        for (const a of n.getAnimations()) { try { a.finish() } catch {} }
    }
    for (const ms of [1500, 1800, 2100]) setTimeout(acabarTudo, ms)
    setTimeout(() => {
      /* ?clique=<seletor> aperta um botao antes do print. Serve para
         fotografar estado aberto — menu, <details>, modal. */
      const sel = q.get('clique')
      if (sel) {
        const alvo = d.querySelector(sel)
        if (alvo) alvo.click()
        /* O --virtual-time-budget do Chrome headless NAO avanca a linha
           do tempo de animacao: sem isto o print sai no meio do morph e
           o painel aparece como um retangulo vazio. `finish()` leva
           cada animacao ao quadro final, que e o estado que interessa
           fotografar. Duas passadas porque o painel so entra no DOM
           depois que o container comeca a abrir. */
        const acabar = () => {
          for (const el of d.querySelectorAll('*'))
            for (const a of el.getAnimations()) { try { a.finish() } catch {} }
        }
        /* Varias passadas: o painel so entra no DOM depois que o
           container comeca a abrir, e o rolo de letra tem atraso
           acumulado (item x 90ms + caractere x 30ms) — o ultimo item
           so comeca em ~720ms. Uma passada so pegava o meio do rolo. */
        for (const ms of [60, 260, 560, 900, 1400]) setTimeout(acabar, ms)
      }
    }, 400)
  }, 2200))
</script>
